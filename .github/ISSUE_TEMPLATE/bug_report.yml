name: Bug 反馈
description: 输出不对、读不到数据、日志报错，或文档与实测不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        报之前先过一遍 [SUPPORT.md](../blob/main/SUPPORT.md) 的三步自查 ——
        「演练模式还开着」「数据源还是模拟剧本」「游戏更新导致偏移失效」能覆盖大部分情况。

        涉及强度越界、急停失效、误触发这类问题，请走 [SECURITY.md](../blob/main/SECURITY.md) 的私密渠道，不要开公开 issue。

  - type: dropdown
    id: kind
    attributes:
      label: 哪一类
      options:
        - 完全没有输出（日志也没动静）
        - 有输出但档位/强度不对
        - 读不到数据（invalid / 自检提示）
        - 受击脉冲多了或少了
        - 死亡脉冲行为不对
        - 进程附加问题（名字、多开、权限）
        - 日志或面板显示问题
        - 文档与实测不符
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 插件版本
      description: manifest.json 里的 version，或 DGHub 插件列表里显示的版本
      placeholder: v2.20.5
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 数据源
      options:
        - 内存只读轮询（正式）
        - 模拟数据（无游戏）
        - 关闭
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: DGHub 日志里从「连接 DGHub」到出错的那几行，包含 slot= / reason= 字段
      render: text
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: 进程探测输出
      description: 游戏运行时执行 `python tools\probe_process.py`，把完整输出贴在这里
      render: text
    validations:
      required: false

  - type: textarea
    id: expect
    attributes:
      label: 期望行为 vs 实际行为
      description: 你当时在游戏里做了什么、期望插件怎么输出、实际怎么输出
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已按 SUPPORT.md 自查过三步
          required: true
        - label: 日志已检查过，不含我不想公开的隐私内容
          required: false
